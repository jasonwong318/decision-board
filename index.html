<!DOCTYPE html>
<html lang="zh-Hant" data-theme="ritual">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>決策板 Decision Board</title>
<meta name="description" content="A provably fair decision board — drop a ball, let it pick between your options.">
<meta name="theme-color" content="#0b0a09">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="決策板">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme-ritual.css">
<link rel="stylesheet" href="css/theme-ivory.css">
<link rel="stylesheet" href="css/board-classic.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<div class="app" id="app" data-screen="mode" data-mode="evolved">

  <header class="topbar">
    <button type="button" class="brand" id="btn-home" data-i18n-attr="title:nav.home,aria-label:nav.home">
      <!-- A ball above the chute it is about to fall into. -->
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="6.5" r="2.9" class="brand-ball"/>
        <path d="M5.5 10.5 V13 L12 20 L18.5 13 V10.5" class="brand-fork"/>
      </svg>
      <span class="brand-name" data-i18n="app.name"></span>
    </button>
    <nav class="topbar-actions">
      <button type="button" class="icon-btn" id="btn-fair" data-i18n-attr="title:nav.fair,aria-label:nav.fair">?</button>
      <button type="button" class="icon-btn" id="btn-history" data-i18n-attr="title:nav.history,aria-label:nav.history">☰</button>
      <!-- Labelled from JS: the toggle names the theme it switches *to*. -->
      <button type="button" class="icon-btn" id="btn-theme">◐</button>
      <button type="button" class="icon-btn icon-btn-text" id="btn-lang" data-i18n-attr="title:nav.lang,aria-label:nav.lang">EN</button>
    </nav>
  </header>

  <main>
    <!-- -------------------------------------------------------- mode -->
    <section class="screen" id="screen-mode" aria-labelledby="mode-heading">
      <p class="eyebrow" data-i18n="mode.eyebrow"></p>
      <h1 id="mode-heading" class="display" data-i18n="mode.heading"></h1>

      <ul class="mode-list">
        <li>
          <button type="button" class="mode-card" id="btn-mode-classic">
            <!-- Three rows that converge: two channels arriving at one node. -->
            <svg class="mode-thumb" viewBox="0 0 64 44" aria-hidden="true" focusable="false">
              <path class="mode-thumb-line" d="M32 4 V10
                M32 10 L16 22 M32 10 L48 22
                M16 22 L8 34 M16 22 L32 34
                M48 22 L32 34 M48 22 L56 34"/>
              <circle class="mode-thumb-merge" cx="32" cy="34" r="3.4"/>
            </svg>
            <span class="mode-card-body">
              <span class="eyebrow mode-tag" data-i18n="mode.classicTag"></span>
              <span class="mode-name display" data-i18n="mode.classicName"></span>
              <span class="mode-desc" data-i18n="mode.classicBody"></span>
            </span>
          </button>
        </li>
        <li>
          <button type="button" class="mode-card" id="btn-mode-evolved">
            <!-- The same three rows, splitting only: eight separate endings. -->
            <svg class="mode-thumb" viewBox="0 0 64 44" aria-hidden="true" focusable="false">
              <path class="mode-thumb-line" d="M32 4 V10
                M32 10 L16 22 M32 10 L48 22
                M16 22 L8 34 M16 22 L24 34
                M48 22 L40 34 M48 22 L56 34"/>
            </svg>
            <span class="mode-card-body">
              <span class="eyebrow mode-tag" data-i18n="mode.evolvedTag"></span>
              <span class="mode-name display" data-i18n="mode.evolvedName"></span>
              <span class="mode-desc" data-i18n="mode.evolvedBody"></span>
            </span>
          </button>
        </li>
      </ul>
    </section>

    <!-- ------------------------------------------------------- setup -->
    <section class="screen" id="screen-setup" aria-labelledby="setup-heading">
      <button type="button" class="quiet back-btn" id="btn-mode-back" data-i18n="mode.change"></button>
      <p class="eyebrow" data-i18n="setup.eyebrow"></p>
      <h1 id="setup-heading" class="display" data-i18n="app.tagline"></h1>

      <form id="setup-form" novalidate>
        <label class="field">
          <span class="field-label" data-i18n="setup.question"></span>
          <input type="text" id="question" class="rule-input" maxlength="60" autocomplete="off"
                 data-i18n-attr="placeholder:setup.questionPlaceholder">
        </label>

        <!-- The classic board's three outcomes are printed on the panel, so it
             has nothing to configure beyond the question. -->
        <div id="options-block">
          <div class="options-head">
            <span class="field-label" data-i18n="setup.options"></span>
            <span class="hint" data-i18n="setup.hint"></span>
          </div>
          <ul class="option-list" id="option-list"></ul>
          <button type="button" class="ghost add-btn" id="btn-add" data-i18n="setup.add"></button>
        </div>

        <p class="classic-note" id="setup-classic-note" data-i18n="setup.classicNote" hidden></p>
        <p class="error" id="setup-error" role="alert"></p>
        <button type="submit" class="primary" id="btn-start" data-i18n="setup.start"></button>
      </form>
    </section>

    <!-- ------------------------------------------------------- board -->
    <section class="screen" id="screen-board" aria-labelledby="board-question">
      <div class="board-head">
        <div class="board-head-row">
          <button type="button" class="quiet" id="btn-edit" data-i18n="board.edit"></button>
          <button type="button" class="quiet" id="btn-share" data-i18n="board.share"></button>
        </div>
        <p class="eyebrow" data-i18n="board.eyebrow"></p>
        <h1 id="board-question" class="display"></h1>
      </div>

      <div class="board-wrap">
        <svg id="board" role="img" aria-labelledby="board-question"></svg>
      </div>

      <ul class="legend" id="legend"></ul>

      <div class="board-actions">
        <button type="button" class="primary big" id="btn-drop" data-i18n="board.drop"></button>
        <p class="hint" id="skip-hint" data-i18n="board.skip"></p>
      </div>
    </section>
  </main>

  <p class="sr-only" id="live" aria-live="polite"></p>

  <!-- ------------------------------------------------------- verdict -->
  <div class="overlay overlay-verdict" id="result-overlay" hidden>
    <div class="verdict" role="dialog" aria-modal="true" aria-labelledby="result-label">
      <span class="verdict-rule" aria-hidden="true"></span>
      <p class="eyebrow verdict-kicker" id="result-kicker"></p>
      <p class="verdict-label" id="result-label"></p>
      <p class="verdict-note" id="result-body"></p>
      <span class="verdict-rule verdict-rule-end" aria-hidden="true"></span>
      <!-- Deliberately not the loud button: on this screen the answer is the hero. -->
      <div class="verdict-actions">
        <button type="button" class="ghost" id="btn-again"></button>
        <button type="button" class="quiet" id="btn-result-close" data-i18n="result.close"></button>
      </div>
    </div>
  </div>

  <!-- ----------------------------------------------------- fairness -->
  <div class="overlay" id="fair-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fair-title">
      <p class="eyebrow" data-i18n="fair.eyebrow"></p>
      <h2 id="fair-title" class="display"></h2>
      <p class="sheet-body" id="fair-body"></p>
      <p class="hint" id="fair-exits"></p>
      <table class="odds" id="odds-table"></table>
      <p class="hint fair-compare" id="fair-compare" hidden></p>
      <div class="sheet-actions">
        <button type="button" class="ghost" id="btn-fair-close" data-i18n="nav.close"></button>
      </div>
    </div>
  </div>

  <!-- ------------------------------------------------------ history -->
  <div class="overlay" id="history-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="history-title">
      <p class="eyebrow" data-i18n="history.eyebrow"></p>
      <h2 id="history-title" class="display" data-i18n="history.title"></h2>
      <ul class="history-list" id="history-list"></ul>
      <div class="sheet-actions">
        <button type="button" class="ghost" id="btn-history-clear" data-i18n="history.clear"></button>
        <button type="button" class="ghost" id="btn-history-close" data-i18n="nav.close"></button>
      </div>
    </div>
  </div>

  <button type="button" class="update-banner" id="update-banner" data-i18n="update.ready" hidden></button>

  <p class="toast" id="toast" hidden></p>
</div>

<template id="option-row-template">
  <li class="option-row">
    <span class="option-key" aria-hidden="true"></span>
    <input type="text" class="option-input rule-input" maxlength="60" autocomplete="off">
    <button type="button" class="icon-btn remove-btn" data-i18n-attr="title:setup.remove,aria-label:setup.remove">×</button>
  </li>
</template>

<script type="module" src="js/main.js"></script>
</body>
</html>
